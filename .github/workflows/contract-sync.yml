name: contract-sync

# The quotes contract under contracts/ is a snapshot of code.examples.net.quotes' frozen
# document (docs/openapi/quotes-v1.openapi.yaml). This workflow is the snapshot's
# tripwire: a scheduled job diffs the committed copy against the backend
# repository's public raw URL — an HTTP read, deliberately not a submodule, so the
# two repositories never recurse — and a manual dispatch refreshes the snapshot,
# regenerates the client types and opens the sync PR for review.
on:
  schedule:
    # Daily drift check (UTC); the backend freezes contracts rarely, so a day of
    # lag between freeze and alarm is the normal worst case.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: "Refresh the snapshot and open a sync PR (off = drift-check only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contract-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://raw.githubusercontent.com/josnelihurt/code.examples.net.quotes/main/docs/openapi/quotes-v1.openapi.yaml

jobs:
  drift:
    name: contract drift vs code.examples.net.quotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the backend's frozen document
        run: curl -fsSL "$UPSTREAM_URL" -o /tmp/upstream.openapi.yaml

      - name: Fail when the committed snapshot drifted
        run: |
          set -euo pipefail
          if diff -u contracts/quotes-v1.openapi.yaml /tmp/upstream.openapi.yaml; then
            echo "The snapshot matches code.examples.net.quotes' frozen contract."
            exit 0
          fi
          echo "::error::contracts/quotes-v1.openapi.yaml no longer matches code.examples.net.quotes' frozen document."
          echo "Run this workflow again with the sync input enabled: it refreshes the"
          echo "snapshot, regenerates src/api/schema.d.ts and opens the sync PR for review."
          exit 1

  sync:
    name: refresh snapshot and open the sync pr
    if: github.event_name == 'workflow_dispatch' && inputs.sync == true
    runs-on: ubuntu-latest
    permissions:
      # Push the sync branch and open its PR; the PR itself merges only through the
      # usual review + merge-me path, so a contract change is never self-landing.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fetch the backend's frozen document
        run: curl -fsSL "$UPSTREAM_URL" -o /tmp/upstream.openapi.yaml

      - name: Nothing to do when they still match
        run: |
          if diff -q contracts/quotes-v1.openapi.yaml /tmp/upstream.openapi.yaml >/dev/null; then
            echo "The snapshot is already current — no sync PR needed."
            echo "SKIP_SYNC=true" >> "$GITHUB_ENV"
          fi

      - name: Refresh snapshot and regenerate the client types
        if: env.SKIP_SYNC != 'true'
        run: |
          set -euo pipefail
          cp /tmp/upstream.openapi.yaml contracts/quotes-v1.openapi.yaml
          pnpm install --frozen-lockfile
          pnpm run gen:api

      - name: Open the sync PR
        if: env.SKIP_SYNC != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="chore/contract-sync-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add contracts/quotes-v1.openapi.yaml src/api/schema.d.ts
          git commit -m "chore: sync the quotes contract snapshot"
          git push origin "$branch"
          gh pr create \
            --title "chore: sync the quotes contract snapshot" \
            --body "The frozen quotes contract in [code.examples.net.quotes](https://github.com/josnelihurt/code.examples.net.quotes) moved; this refreshes the snapshot under \`contracts/\` and regenerates \`src/api/schema.d.ts\` from it. Opened automatically by the contract-sync workflow (manual dispatch). Review the contract diff, then label \`merge-me\` to land it." \
            --base main \
            --head "$branch"
